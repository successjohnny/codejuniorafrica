
name: JavaScript Type Checking

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck:
    name: Check JavaScript Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript types
        run: npm run typecheck